<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Kareem Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="/" class="brand">Kareem<span class="brand-dot">.</span> <span class="admin-tag">Admin</span></a>
      <div class="admin-header-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle color theme">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="/" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
          View Site
        </a>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <p class="admin-lede">Manage your portfolio's projects, skills and about info.</p>

    <div class="admin-grid">
      <section class="panel reveal">
        <div class="panel-head">
          <h2 id="project-form-title">Add Project</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 21V9"></path></svg>
          </span>
        </div>
        <div class="form">
          <div class="field">
            <label for="p-title">Title</label>
            <input type="text" id="p-title" placeholder="e.g. E-commerce dashboard" />
          </div>
          <div class="field">
            <label for="p-description">Description</label>
            <textarea id="p-description" placeholder="What does this project do?"></textarea>
          </div>
          <div class="field">
            <label for="p-image">Image</label>
            <input type="file" id="p-image" accept="image/*" />
          </div>
          <div class="field">
            <label for="p-tech">Technologies</label>
            <input type="text" id="p-tech" placeholder="React, Node.js, MongoDB" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="p-github">GitHub URL</label>
              <input type="text" id="p-github" placeholder="https://github.com/..." />
            </div>
            <div class="field">
              <label for="p-live">Live URL</label>
              <input type="text" id="p-live" placeholder="https://..." />
            </div>
          </div>
          <input type="hidden" id="p-edit-id" />
          <div class="form-actions">
            <button id="add-project-btn" class="btn btn-primary">Add Project</button>
            <button id="cancel-edit-btn" class="btn btn-ghost" style="display:none;">Cancel</button>
          </div>
          <p id="project-msg" class="msg"></p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2>Existing Projects</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </span>
        </div>
        <div id="projects-list">
          <p class="loading">Loading...</p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2>Edit About</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
          </span>
        </div>
        <div class="form">
          <div class="field">
            <label for="a-name">Name</label>
            <input type="text" id="a-name" placeholder="Your full name" />
          </div>
          <div class="field">
            <label for="a-title">Title</label>
            <input type="text" id="a-title" placeholder="e.g. Frontend Developer" />
          </div>
          <div class="field">
            <label for="a-bio">Bio</label>
            <textarea id="a-bio" placeholder="A short bio about you"></textarea>
          </div>
          <div class="field">
            <label for="a-email">Email</label>
            <input type="text" id="a-email" placeholder="you@example.com" />
          </div>
          <div class="form-actions">
            <button id="save-about-btn" class="btn btn-primary">Save About</button>
          </div>
          <p id="about-msg" class="msg"></p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2 id="experience-form-title">Add Experience</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          </span>
        </div>
        <div class="form">
          <div class="field">
            <label for="x-role">Role</label>
            <input type="text" id="x-role" placeholder="e.g. Frontend Developer" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="x-company">Company</label>
              <input type="text" id="x-company" placeholder="e.g. EMS — Engineering Management Systems" />
            </div>
            <div class="field">
              <label for="x-location">Location</label>
              <input type="text" id="x-location" placeholder="e.g. Cairo, Egypt" />
            </div>
          </div>
          <div class="field">
            <label for="x-period">Period</label>
            <input type="text" id="x-period" placeholder="e.g. 2024 — Present" />
          </div>
          <div class="field">
            <label for="x-bullets">Responsibilities (one per line)</label>
            <textarea id="x-bullets" placeholder="Designed and built 5+ live SCADA/IoT dashboards..."></textarea>
          </div>
          <div class="field">
            <label for="x-tech">Technologies</label>
            <input type="text" id="x-tech" placeholder="React, TypeScript, SCADA" />
          </div>
          <input type="hidden" id="x-edit-id" />
          <div class="form-actions">
            <button id="add-experience-btn" class="btn btn-primary">Add Experience</button>
            <button id="cancel-edit-experience-btn" class="btn btn-ghost" style="display:none;">Cancel</button>
          </div>
          <p id="experience-msg" class="msg"></p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2>Existing Experience</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </span>
        </div>
        <div id="experience-list">
          <p class="loading">Loading...</p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2 id="education-form-title">Add Education</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 10-10-6L2 10l10 6 10-6Z"></path><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"></path></svg>
          </span>
        </div>
        <div class="form">
          <div class="field">
            <label for="e-title">Title</label>
            <input type="text" id="e-title" placeholder="e.g. Computer Science" />
          </div>
          <div class="field">
            <label for="e-institution">Institution</label>
            <input type="text" id="e-institution" placeholder="e.g. Canadian International College (CIC) — Cairo" />
          </div>
          <div class="field">
            <label for="e-description">Description</label>
            <textarea id="e-description" placeholder="What did you study or cover?"></textarea>
          </div>
          <div class="field">
            <label for="e-period">Period</label>
            <input type="text" id="e-period" placeholder="e.g. 2019 — 2021 or Completed" />
          </div>
          <input type="hidden" id="e-edit-id" />
          <div class="form-actions">
            <button id="add-education-btn" class="btn btn-primary">Add Education</button>
            <button id="cancel-edit-education-btn" class="btn btn-ghost" style="display:none;">Cancel</button>
          </div>
          <p id="education-msg" class="msg"></p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2>Existing Education</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </span>
        </div>
        <div id="education-list">
          <p class="loading">Loading...</p>
        </div>
      </section>

      <section class="panel reveal">
        <div class="panel-head">
          <h2>Add Skill</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"></path></svg>
          </span>
        </div>
        <div class="form">
          <div class="field">
            <label for="s-name">Skill name</label>
            <input type="text" id="s-name" placeholder="e.g. JavaScript" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="s-level">Level</label>
              <input type="text" id="s-level" placeholder="e.g. Advanced" />
            </div>
            <div class="field">
              <label for="s-category">Category</label>
              <input type="text" id="s-category" placeholder="e.g. Frontend" />
            </div>
          </div>
          <div class="form-actions">
            <button id="add-skill-btn" class="btn btn-primary">Add Skill</button>
          </div>
          <p id="skill-msg" class="msg"></p>
        </div>
      </section>

      <section class="panel reveal panel-wide">
        <div class="panel-head">
          <h2>Existing Skills</h2>
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </span>
        </div>
        <div id="skills-list" class="items-grid">
          <p class="loading">Loading...</p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
