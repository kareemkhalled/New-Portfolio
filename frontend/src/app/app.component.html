<ng-container *ngIf="!isDashboard()">
  <button class="menu-toggle" type="button" (click)="toggleMenu()" [class.is-open]="menuOpen()" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <aside class="sidebar" [class.is-open]="menuOpen()">
    <div class="brand">
      <span class="brand-bracket"></span>
      <span class="brand-text">Portfolio</span>
    </div>

    <nav class="side-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
        <span>Home</span>
      </a>
      <a routerLink="/about" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span>About</span>
      </a>
      <a routerLink="/projects" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/><path d="M3 12.5h18"/></svg>
        <span>Projects</span>
      </a>
      <a routerLink="/skills" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/></svg>
        <span>Skills</span>
      </a>
      <a routerLink="/experience" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        <span>Experience</span>
      </a>
    </nav>

    <a class="side-cta" routerLink="/dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/></svg>
      <span>Admin</span>
    </a>
  </aside>

  <div class="sidebar-scrim" *ngIf="menuOpen()" (click)="toggleMenu()"></div>
</ng-container>

<main [class.with-sidebar]="!isDashboard()">
  <router-outlet></router-outlet>
</main>
