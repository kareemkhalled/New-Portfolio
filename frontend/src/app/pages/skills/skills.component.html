<section class="page">
  <p class="eyebrow fade-up">Toolbox</p>
  <h1 class="fade-up">Skills</h1>

  <div class="skill-groups">
    <div class="skill-group fade-up" *ngFor="let group of groupedSkills; let i = index" [style.animation-delay.ms]="i * 60">
      <h2 class="group-title">{{ group.category }}</h2>
      <div class="group-chips">
        <span class="chip" *ngFor="let skill of group.skills">{{ skill.name }}</span>
      </div>
    </div>
  </div>

  <p class="empty-state" *ngIf="!skills?.length">No skills added yet.</p>
</section>
