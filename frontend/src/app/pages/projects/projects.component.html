<section class="page">
  <p class="eyebrow fade-up">Portfolio</p>
  <h1 class="fade-up">Projects</h1>

  <div class="project-grid">
    <div class="project-card fade-up" *ngFor="let project of projects; let i = index" [style.animation-delay.ms]="i * 90">
      <div class="project-thumb" *ngIf="project.imageUrl">
        <img [src]="project.imageUrl" [alt]="project.title" />
      </div>

      <div class="project-body">
        <h2>{{ project.title }}</h2>
        <p>{{ project.description }}</p>

        <ul class="tech-list" *ngIf="project.technologies?.length">
          <li *ngFor="let tech of project.technologies">{{ tech }}</li>
        </ul>

        <div class="project-links">
          <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>
            Live Demo
          </a>
          <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a9 9 0 0 0-2.85 17.54c.45.08.6-.2.6-.43v-1.7c-2.5.55-3.03-1.07-3.03-1.07-.4-1.05-1-1.33-1-1.33-.83-.57.06-.56.06-.56.9.06 1.38.93 1.38.93.8 1.4 2.1 1 2.6.76.08-.6.32-1 .58-1.23-2-.23-4.1-1-4.1-4.5 0-1 .35-1.8.93-2.44-.1-.23-.4-1.15.09-2.4 0 0 .76-.24 2.5.93a8.6 8.6 0 0 1 4.55 0c1.73-1.17 2.5-.93 2.5-.93.48 1.25.17 2.17.08 2.4.58.64.93 1.44.93 2.44 0 3.5-2.1 4.27-4.1 4.5.32.28.6.83.6 1.68v2.5c0 .23.15.51.6.43A9 9 0 0 0 12 3Z"/></svg>
            GitHub
          </a>
        </div>
      </div>
    </div>
  </div>

  <p class="empty-state" *ngIf="!projects?.length">No projects added yet.</p>
</section>
