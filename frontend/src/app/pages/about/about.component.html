<section class="page">
  <div class="about-wrap fade-up" *ngIf="about">
    <div class="about-photo-col" *ngIf="about.photoUrl">
      <img [src]="about.photoUrl" [alt]="about.name" class="about-photo" />
    </div>

    <div class="about-info">
      <p class="eyebrow">About me</p>
      <h1>{{ about.name }}</h1>
      <h2 *ngIf="about.title">{{ about.title }}</h2>
      <p class="bio" *ngIf="about.bio">{{ about.bio }}</p>
      <a class="email" *ngIf="about.email" [href]="'mailto:' + about.email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
        {{ about.email }}
      </a>
    </div>
  </div>
</section>
