<section class="hero" *ngIf="about">
  <div class="hero-text">
    <p class="eyebrow fade-up">Hello, my name is</p>
    <h1 class="name fade-up" style="animation-delay: .05s">{{ about.name }}</h1>

    <h2 class="role-line fade-up" style="animation-delay: .1s" *ngIf="about.title">
      I'm a
      <span class="typewriter" [style.--chars]="about.title.length">{{ about.title }}</span>
    </h2>


    

    <a routerLink="/projects" class="tagline fade-up" style="animation-delay: .15s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
      Ready to see what I do best? Let's dive in!
    </a>
    <section class="about-section fade-up" *ngIf="about && about.bio">
  <p class="eyebrow">About Me</p>
  <p class="bio">{{ about.bio }}</p>
  <a class="about-email" [href]="'mailto:' + about.email" *ngIf="about.email">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
    {{ about.email }}
  </a>
</section>


    <div class="socials fade-up" style="animation-delay: .2s">
      <a href="https://www.linkedin.com/in/kareem-khaled-901b5a2a5" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 10v6.5M7.5 7.2v.1M12 16.5V13a2.3 2.3 0 0 1 4.5 0v3.5M12 16.5v-4"/></svg>
      </a>
      <a href="https://github.com/kareemkhalled" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a9 9 0 0 0-2.85 17.54c.45.08.6-.2.6-.43v-1.7c-2.5.55-3.03-1.07-3.03-1.07-.4-1.05-1-1.33-1-1.33-.83-.57.06-.56.06-.56.9.06 1.38.93 1.38.93.8 1.4 2.1 1 2.6.76.08-.6.32-1 .58-1.23-2-.23-4.1-1-4.1-4.5 0-1 .35-1.8.93-2.44-.1-.23-.4-1.15.09-2.4 0 0 .76-.24 2.5.93a8.6 8.6 0 0 1 4.55 0c1.73-1.17 2.5-.93 2.5-.93.48 1.25.17 2.17.08 2.4.58.64.93 1.44.93 2.44 0 3.5-2.1 4.27-4.1 4.5.32.28.6.83.6 1.68v2.5c0 .23.15.51.6.43A9 9 0 0 0 12 3Z"/></svg>
      </a>
      <a [href]="'mailto:' + about.email" *ngIf="about.email" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      </a>
      <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 4h-2a3.5 3.5 0 0 0-3.5 3.5V10H7v3h2.5v7H13v-7h2.5l.5-3H13V8a1 1 0 0 1 1-1h2Z"/></svg>
      </a>
    </div>

    <a href="Kareem_Khaled_CV.pdf" download class="cv-btn fade-up" style="animation-delay: .25s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download my CV
    </a>
  </div>

  <div class="hero-photo fade-up" style="animation-delay: .15s">
    <div class="photo-frame">
      <img *ngIf="about.photoUrl" [src]="about.photoUrl" [alt]="about.name" />
      <div class="photo-placeholder" *ngIf="!about.photoUrl">{{ about.name.charAt(0) }}</div>
    </div>
  </div>
</section>


<section class="hero hero-loading" *ngIf="!about">
  <div class="skeleton-line w-40"></div>
  <div class="skeleton-line w-70 lg"></div>
  <div class="skeleton-line w-50"></div>
</section>
